# Patch runner validated after correcting YAML block indentation.
name: Core Room Reservation Fix

on:
  push:
    branches:
      - stress/main-core-service
    paths:
      - .github/workflows/core-room-reservation-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stress/main-core-service
          fetch-depth: 0

      - name: Apply room reopening state-machine fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("game/src/Simulation.cpp")
          text = path.read_text(encoding="utf-8")
          old_lines = [
              "  if (!closed) {",
              "    const bool activeRepair =",
              "        std::any_of(impl_->tasks.begin(), impl_->tasks.end(), [&](auto &task) {",
              "          return task.targetId == id && task.kind == TaskKind::Repair &&",
              "                 task.status != TaskStatus::Completed;",
              "        });",
              "    if ((!r->closed && r->status == RoomStatus::OutOfOrder) || activeRepair ||",
              "        r->condition < 40)",
              '      return {false, "Room must be repaired before reopening"};',
              "  }",
          ]
          new_lines = [
              "  if (!closed) {",
              "    const bool activeRepair =",
              "        std::any_of(impl_->tasks.begin(), impl_->tasks.end(), [&](auto &task) {",
              "          return task.targetId == id && task.kind == TaskKind::Repair &&",
              "                 task.status != TaskStatus::Completed;",
              "        });",
              "    const bool activeTurnover =",
              "        std::any_of(impl_->tasks.begin(), impl_->tasks.end(), [&](auto &task) {",
              "          return task.targetId == id && task.kind == TaskKind::Turnover &&",
              "                 task.status != TaskStatus::Completed;",
              "        });",
              "    if ((!r->closed && r->status == RoomStatus::OutOfOrder) || activeRepair ||",
              "        activeTurnover || r->condition < 40)",
              "      return {false, activeTurnover",
              '                         ? "Room service must complete before reopening"',
              '                         : "Room must be repaired before reopening"};',
              "  }",
          ]
          old = "\n".join(old_lines) + "\n"
          new = "\n".join(new_lines) + "\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("closeRoom reopening anchor not found")
          if text.count("const bool activeTurnover =") != 1:
              raise SystemExit("unexpected active-turnover guard count")
          path.write_text(text, encoding="utf-8")

      - name: Verify stress invariant remains strict
        shell: bash
        run: |
          grep -F 'const bool assignedStatus = room.status == RoomStatus::Reserved ||' game/tests/stress/CoreSimulationStressTests.cpp
          grep -F 'assignedStatus != (room.reservationId != 0)' game/tests/stress/CoreSimulationStressTests.cpp

      - name: Build core stress target
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target hh_core_simulation_stress_tests --parallel 4

      - name: Reproduce operation-316 stream after fix
        shell: bash
        env:
          HH_STRESS_SCALE: pr
          HH_STRESS_SEED: "0xc0ffee1234abcdef"
          HH_STRESS_SCENARIO: burst_commands
        run: ./build/game/hh_core_simulation_stress_tests

      - name: Run full core stress campaign
        shell: bash
        env:
          HH_STRESS_SCALE: pr
          HH_STRESS_SEED: "0xc0ffee1234abcdef"
        run: ./build/game/hh_core_simulation_stress_tests

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "hotel-haven-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/src/Simulation.cpp
          if git diff --cached --quiet; then
            echo "Fix already present"
            exit 0
          fi
          git commit -m "fix: keep active room turns unavailable"
          git push origin HEAD:stress/main-core-service
