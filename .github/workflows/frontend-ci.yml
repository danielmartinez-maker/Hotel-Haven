name: Frontend CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure frontend
        run: cmake -S frontend -B frontend/build -A x64
      - name: Build frontend
        run: cmake --build frontend/build --config Release
      - name: Test frontend
        run: ctest --test-dir frontend/build -C Release --output-on-failure
      - name: Configure renderer
        run: cmake -S renderer -B renderer/build -A x64
      - name: Build renderer
        run: cmake --build renderer/build --config Release
      - name: Test renderer
        run: ctest --test-dir renderer/build -C Release --output-on-failure
