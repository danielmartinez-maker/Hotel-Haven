name: Frontend CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure frontend
        run: cmake -S frontend -B frontend/build -A x64
      - name: Build frontend
        run: cmake --build frontend/build --config Release
      - name: Test frontend
        run: ctest --test-dir frontend/build -C Release --output-on-failure
      - name: Configure renderer
        run: cmake -S renderer -B renderer/build -A x64
      - name: Build renderer
        run: cmake --build renderer/build --config Release
      - name: Test renderer
        run: ctest --test-dir renderer/build -C Release --output-on-failure
      - name: Configure integrated UI compile check
        run: cmake -S . -B ui-build -A x64 -DHH_GAME_BUILD_TESTS=OFF
      - name: Compile integrated FINAL-07 UI
        run: cmake --build ui-build --config Release --target hh_final07_ui_compile --parallel 4
      - name: Build FINAL-07 UI contract tests
        run: cmake --build ui-build --config Release --target hh_final07_client_contract_tests --parallel 4
      - name: Test FINAL-07 UI contract
        run: ctest --test-dir ui-build -C Release -R hh_final07_client_contract_tests --output-on-failure

  final07-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure FINAL-07 contract
        run: cmake -S . -B ui-contract-build -DHH_GAME_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build FINAL-07 contract
        run: cmake --build ui-contract-build --target hh_final07_client_contract_tests --parallel 2
      - name: Test FINAL-07 contract
        run: ctest --test-dir ui-contract-build -R hh_final07_client_contract_tests --output-on-failure
