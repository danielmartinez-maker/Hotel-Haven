name: Integrated Game
on:
  push:
    branches: [main, feature/full-game-integration]
  pull_request:
  workflow_dispatch:
jobs:
  game:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for production assets
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install production asset dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r Tools/ArtGeneration/requirements.txt

      - name: Validate production asset manifest
        if: runner.os == 'Windows'
        run: python Tools/ContentPipeline/scripts/validate_asset_library.py

      - name: Generate production asset library
        if: runner.os == 'Windows'
        run: python Tools/ArtGeneration/generate_all_assets.py .

      - name: Validate production asset geometry
        if: runner.os == 'Windows'
        run: python Tools/ArtGeneration/validate_generated_geometry.py .

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4 2>&1 | Tee-Object -FilePath build/build-output.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $diagnostics = @(Select-String -Path build/build-output.log -Pattern 'error(:| [A-Z][0-9]+)|fatal error:|FAILED' | Select-Object -Last 50)
            if ($diagnostics.Count -eq 0) { $diagnostics = @(Get-Content build/build-output.log | Select-Object -Last 80) }
            foreach ($diagnostic in $diagnostics) { Write-Output "::error::$diagnostic" }
            exit $buildExit
          }

      - name: Cook renderer-safe runtime asset library
        if: runner.os == 'Windows'
        run: build/Tools/ContentPipeline/Release/asset.exe cook --runtime

      - name: Audit all cooked renderer assets
        if: runner.os == 'Windows'
        run: build/renderer/Release/hh_runtime_asset_library_audit.exe Build/CookedAssets

      - name: Stage runtime assets beside client
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target hotel_haven_stage_runtime_assets

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath build/test-output.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $diagnostics = @(Get-Content build/test-output.log | Select-Object -Last 25)
            foreach ($diagnostic in $diagnostics) { Write-Output "::error::$diagnostic" }
            exit $testExit
          }

      - name: Windows client smoke test
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process build/Release/hotel_haven.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Client smoke test failed: $($p.ExitCode)" }

      - name: Verify Windows smoke screenshots
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @('smoke-guide.bmp', 'smoke-hotel.bmp', 'smoke-build.bmp', 'smoke-rooms.bmp', 'smoke-guests.bmp')
          $missing = @($required | Where-Object { -not (Test-Path "build/Release/$_") })
          if ($missing.Count -gt 0) { throw "Missing Windows smoke screenshots: $($missing -join ', ')" }
          foreach ($name in $required) {
            $screenshot = Get-Item "build/Release/$name"
            if ($screenshot.Length -lt 54) { throw "Windows smoke screenshot is empty or truncated: $name" }
          }

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: Hotel-Haven-Visual-QA
          path: |
            build/Release/smoke-guide.bmp
            build/Release/smoke-hotel.bmp
            build/Release/smoke-build.bmp
            build/Release/smoke-rooms.bmp
            build/Release/smoke-guests.bmp
          if-no-files-found: error

      - name: Package
        if: runner.os == 'Windows'
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      - name: Verify complete release package integrity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/package/*.zip | Select-Object -First 1
          if (-not $zip) { throw "Packaged Hotel Haven zip not found" }
          python Tools/Release/verify_release_package.py $zip.FullName

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Hotel-Haven-Windows
          path: build/package/*.zip
