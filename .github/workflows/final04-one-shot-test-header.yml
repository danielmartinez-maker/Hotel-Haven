name: FINAL-04 One-Shot Save Header Test Update

on:
  push:
    branches:
      - feature/final-04-service-logistics
    paths:
      - '.github/workflows/final04-one-shot-test-header.yml'

permissions:
  contents: write

jobs:
  update-test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
          fetch-depth: 0
      - name: Update save version assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('game/tests/SimulationTests.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'saved.find("HHGS 7 16 32 20 3")'
          new = 'saved.find("HHGS 8 16 32 20 3")'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one HHGS 7 assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit test contract update
        run: |
          git config user.name "hotel-haven-final04-bot"
          git config user.email "actions@users.noreply.github.com"
          git add game/tests/SimulationTests.cpp
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test(game): expect HHGS v8 after FINAL-04 persistence"
          git push origin HEAD:feature/final-04-service-logistics
