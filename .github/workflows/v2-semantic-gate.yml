name: V2 Semantic Gate

on:
  push:
    branches:
      - stress/asset-pipeline-v2
    paths:
      - .github/workflows/v2-semantic-gate.yml
      - Tools/ArtGeneration/**
      - GameData/AssetDefinitions/Manifest/**

jobs:
  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install art-generation dependencies
        run: python -m pip install -r Tools/ArtGeneration/requirements.txt
      - name: Run complete art-generator regression suite
        run: python -m pytest Tools/ArtGeneration/tests -q
