name: Apply Full-Game NVIDIA Patch

on:
  push:
    branches:
      - feature/full-game-nvidia-integration
    paths:
      - '.github/workflows/apply-full-game-nvidia-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-game-nvidia-integration
          fetch-depth: 0
      - name: Apply scheduler integration
        run: python Tools/Integration/apply_scheduler_patch.py
      - name: Commit integrated scheduler
        shell: bash
        run: |
          rm Tools/Integration/apply_scheduler_patch.py
          rm .github/workflows/apply-full-game-nvidia-patch.yml
          rmdir Tools/Integration 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate portable optimizer into scheduler"
          git push origin HEAD:feature/full-game-nvidia-integration
