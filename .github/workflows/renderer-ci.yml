name: Renderer CI

on:
  push:
    branches:
      - main
    paths:
      - 'renderer/**'
      - 'Tools/ContentPipeline/**'
      - '.github/workflows/renderer-ci.yml'
  pull_request:
    paths:
      - 'renderer/**'
      - 'Tools/ContentPipeline/**'
      - '.github/workflows/renderer-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S renderer -B renderer/build -A x64

      - name: Build
        run: cmake --build renderer/build --config Release

      - name: Test
        run: ctest --test-dir renderer/build -C Release --output-on-failure
