name: Content Pipeline CI

on:
  push:
    paths:
      - 'Art/**'
      - 'GameData/AssetDefinitions/**'
      - 'Tools/ArtGeneration/**'
      - 'Tools/ContentPipeline/**'
      - 'renderer/**'
      - '.github/workflows/content-pipeline-ci.yml'
  pull_request:
    paths:
      - 'Art/**'
      - 'GameData/AssetDefinitions/**'
      - 'Tools/ArtGeneration/**'
      - 'Tools/ContentPipeline/**'
      - 'renderer/**'
      - '.github/workflows/content-pipeline-ci.yml'

jobs:
  build-test-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install art-generation dependencies
        run: python -m pip install -r Tools/ArtGeneration/requirements.txt

      - name: Test art generators
        run: python -m pytest Tools/ArtGeneration/tests -q

      - name: Validate active asset library manifest
        run: python Tools/ContentPipeline/scripts/validate_asset_library.py

      - name: Generate full asset library
        run: python Tools/ArtGeneration/generate_all_assets.py .

      - name: Validate generated geometry and palette
        run: python Tools/ArtGeneration/validate_generated_geometry.py .

      - name: Render asset preview boards
        run: python Tools/ArtGeneration/render_asset_previews.py .

      - name: Configure content pipeline
        run: cmake -S Tools/ContentPipeline -B Tools/ContentPipeline/build -A x64

      - name: Build content pipeline
        run: cmake --build Tools/ContentPipeline/build --config Release

      - name: Test native content pipeline
        run: ctest --test-dir Tools/ContentPipeline/build -C Release --output-on-failure

      - name: Validate generated repository assets
        run: Tools/ContentPipeline/build/Release/asset.exe validate Art/Exports

      - name: Cook renderer-safe gameplay asset library
        run: Tools/ContentPipeline/build/Release/asset.exe cook --runtime

      - name: Verify cooked runtime-mesh count from generated asset types
        shell: pwsh
        run: |
          $runtimeMeshTypes = @('StaticMeshAsset', 'SkinnedMeshAsset')
          $sidecars = @(Get-ChildItem Art/Exports -Recurse -Filter *.asset.json -File)
          $expected = @(
            $sidecars | Where-Object {
              $metadata = Get-Content $_.FullName -Raw | ConvertFrom-Json
              $runtimeMeshTypes -contains [string]$metadata.asset_type
            }
          ).Count
          $assets = @(Get-ChildItem Build/CookedAssets -Filter *.hasset -File)
          if ($assets.Count -ne $expected) {
            throw "Expected exactly $expected runtime mesh assets from generated sidecars; found $($assets.Count)"
          }
          Write-Host "Verified $($assets.Count) cooked runtime mesh assets from $($sidecars.Count) generated records"

      - name: Configure renderer runtime audit
        run: cmake -S . -B runtime-audit-build -A x64

      - name: Build renderer runtime audit
        run: cmake --build runtime-audit-build --config Release --target hh_runtime_asset_library_audit

      - name: Load all cooked assets through renderer runtime
        run: runtime-audit-build/renderer/Release/hh_runtime_asset_library_audit.exe Build/CookedAssets

      - name: Upload generated and cooked asset package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-haven-generated-assets
          path: |
            Art/Exports/**
            Build/CookedAssets/**
            Art/Validation/full_generation_summary.json
            Art/Validation/generated_geometry_qc.json
            Art/Validation/library_release_audit_v1.md
            Art/Validation/Previews/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
