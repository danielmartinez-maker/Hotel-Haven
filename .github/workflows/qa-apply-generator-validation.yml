name: Apply Generator Validation Fixes

on:
  push:
    branches:
      - 'qa/extensive-verification-2026-09-08'
    paths:
      - '.github/workflows/qa-apply-generator-validation.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes proven by adversarial generator tests
        run: python Tools/QA/apply_generator_validation_fix.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'hotel-haven-qa-bot'
          git config user.email 'hotel-haven-qa-bot@users.noreply.github.com'
          git add Tools/ArtGeneration/batch01_generate.py Tools/ArtGeneration/batch02_generate.py
          git commit -m 'fix: validate generator manifests before writes'
          git push origin HEAD:qa/extensive-verification-2026-09-08
