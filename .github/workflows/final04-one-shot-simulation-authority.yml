name: FINAL-04 FINAL-03 Reconciliation Audit

on:
  push:
    branches:
      - feature/final-04-service-logistics
    paths:
      - .github/workflows/final04-one-shot-simulation-authority.yml

permissions:
  contents: read

jobs:
  inspect-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
          fetch-depth: 0
      - name: Merge latest main without committing
        shell: bash
        run: |
          git fetch origin main
          git config user.name "hotel-haven-final04-bot"
          git config user.email "actions@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          echo "MERGE_STATUS=$status"
          echo "=== CONFLICT FILES ==="
          git diff --name-only --diff-filter=U || true
          echo "=== STATUS ==="
          git status --short
          echo "=== CONFLICT MARKERS ==="
          for f in $(git diff --name-only --diff-filter=U); do
            echo "--- $f ---"
            grep -n -C 8 -E '^(<<<<<<<|=======|>>>>>>>)' "$f" || true
          done
          exit 0
