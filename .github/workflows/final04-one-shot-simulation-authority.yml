# Temporary reconciliation gate. This run materializes the already-verified
# FINAL-03 reconciliation into branch history, then the workflow itself is
# removed in the following externally-triggered cleanup commit.
name: FINAL-04 FINAL-03 Scheduler Reconciliation

on:
  push:
    branches:
      - feature/final-04-service-logistics
    paths:
      - .github/workflows/final04-one-shot-simulation-authority.yml
      - tools/final04_reconcile_scheduler.py
      - tools/final04_reconcile_main.py
      - tools/final04_reconcile_fixtures.py
      - game/include/hh/game/Engineering.h
      - game/src/Engineering.cpp
      - game/tests/EngineeringTests.cpp

permissions:
  contents: write

jobs:
  reconcile-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
          fetch-depth: 0
      - name: Merge current main without committing
        run: |
          git config user.name "hotel-haven-final04-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
      - name: Reconcile FINAL-03 scheduler with FINAL-04 authority
        run: |
          python tools/final04_reconcile_scheduler.py
          python tools/final04_reconcile_main.py
          python tools/final04_reconcile_fixtures.py
          grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' game && exit 1 || true
      - name: Remove reconciliation helpers from final tree
        run: |
          git rm tools/final04_reconcile_scheduler.py
          git rm tools/final04_reconcile_main.py
          git rm tools/final04_reconcile_fixtures.py
      - name: Configure combined build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build combined game
        run: cmake --build build --config Release --parallel 4
      - name: Run combined CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Materialize tested FINAL-03 reconciliation
        run: |
          git add -A
          git status --short
          git commit -m "merge: reconcile FINAL-03 into FINAL-04"
          git push origin HEAD:feature/final-04-service-logistics
