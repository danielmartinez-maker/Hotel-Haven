name: FINAL-04 FINAL-03 Trial Merge

on:
  push:
    branches:
      - feature/final-04-service-logistics
    paths:
      - .github/workflows/final04-one-shot-simulation-authority.yml

permissions:
  contents: read

jobs:
  trial-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
          fetch-depth: 0
      - name: Merge FINAL-03 baseline and union additive build/header conflicts
        shell: bash
        run: |
          git config user.name "hotel-haven-final04-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
          python - <<'PY'
          from pathlib import Path

          cmake = Path('game/CMakeLists.txt')
          text = cmake.read_text()
          for src in ('src/Workforce.cpp', 'src/Departments.cpp', 'src/StaffOptimization.cpp'):
              if src not in text:
                  text = text.replace('  src/ServiceLogistics.cpp\n)', f'  src/ServiceLogistics.cpp\n  {src}\n)')
          if 'hh_workforce_tests' not in text:
              text = text.replace('endif()\n', '''  add_executable(hh_workforce_tests tests/WorkforceTests.cpp)\n  target_link_libraries(hh_workforce_tests PRIVATE hh_game)\n  add_test(NAME Workforce COMMAND hh_workforce_tests)\n\n  add_executable(hh_department_tests tests/DepartmentTests.cpp)\n  target_link_libraries(hh_department_tests PRIVATE hh_game)\n  add_test(NAME Department COMMAND hh_department_tests)\n\n  add_executable(hh_optimizer_tests tests/OptimizerIntegrationTests.cpp)\n  target_link_libraries(hh_optimizer_tests PRIVATE hh_game)\n  add_test(NAME Optimizer COMMAND hh_optimizer_tests)\nendif()\n''', 1)
          cmake.write_text(text)

          header = Path('game/include/hh/game/Simulation.h')
          text = header.read_text()
          anchor = '#include "hh/game/ServiceLogistics.h"\n'
          includes = ''.join(f'#include "hh/game/{name}.h"\n' for name in ('Departments','StaffOptimization','Workforce'))
          if '#include "hh/game/Workforce.h"' not in text:
              text = text.replace(anchor, anchor + includes)
          header.write_text(text)
          PY
          echo "=== MERGED STATUS ==="
          git status --short
          echo "=== CONFLICT MARKERS ==="
          grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' game || true
      - name: Configure combined build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build combined game
        run: cmake --build build --config Release --parallel 4
      - name: Run combined CTest
        run: ctest --test-dir build -C Release --output-on-failure
