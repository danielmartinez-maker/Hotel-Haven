name: FINAL-04 FINAL-03 Replay Audit

on:
  push:
    branches:
      - feature/final-04-service-logistics
    paths:
      - .github/workflows/final04-one-shot-simulation-authority.yml

permissions:
  contents: read

jobs:
  replay-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
          fetch-depth: 0
      - name: Replay FINAL-04 Simulation delta onto FINAL-03 baseline
        shell: bash
        run: |
          git fetch origin main
          git diff d6e895822a80a22d8428cc3657d09dec4f591187..HEAD -- game/src/Simulation.cpp > /tmp/final04-simulation.patch
          git merge --no-commit --no-ff origin/main || true
          git checkout --theirs game/src/Simulation.cpp
          git add game/src/Simulation.cpp
          set +e
          git apply --reject --whitespace=nowarn /tmp/final04-simulation.patch
          apply_status=$?
          set -e
          echo "APPLY_STATUS=$apply_status"
          echo "=== REJECT FILES ==="
          find game/src -name '*.rej' -print
          for f in $(find game/src -name '*.rej' -print); do
            echo "--- $f ---"
            cat "$f"
          done
          echo "=== FINAL04 SYMBOLS AFTER REPLAY ==="
          grep -n -E 'ServiceLogisticsRuntime|serviceInventoryView|workRoomTurnSecond|workEngineeringSecond|FINAL04|Preventive maintenance' game/src/Simulation.cpp || true
