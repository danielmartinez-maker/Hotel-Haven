name: FINAL-04 One-Shot Simulation Authority Patch

on:
  push:
    branches:
      - feature/final-04-service-logistics
    paths:
      - tools/final04_patch_simulation_authority.py
      - .github/workflows/final04-one-shot-simulation-authority.yml

permissions:
  contents: write

jobs:
  apply-simulation-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
          fetch-depth: 0
      - name: Correct final load-migration anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/final04_patch_simulation_authority.py')
          source = p.read_text(encoding='utf-8')
          marker = "''', \"load-inventory-migration\")"
          end = source.index(marker) + len(marker)
          start = source.rfind('replace_once(', 0, end)
          if start < 0:
              raise SystemExit('load migration replace_once block missing')
          block = source[start:end]
          if "r'''" not in block:
              block = block.replace("'''", "r'''")
          source = source[:start] + block + source[end:]
          p.write_text(source, encoding='utf-8')
          PY
      - name: Apply anchored Simulation authority patch
        run: python tools/final04_patch_simulation_authority.py
      - name: Commit Simulation bridge
        run: |
          git config user.name "hotel-haven-final04-bot"
          git config user.email "actions@users.noreply.github.com"
          git add game/src/Simulation.cpp
          git diff --cached --exit-code && exit 1 || true
          git commit -m "feat(game): make FINAL-04 authoritative in Simulation"
          git push origin HEAD:feature/final-04-service-logistics
