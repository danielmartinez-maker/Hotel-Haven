name: FINAL-04 Preventive Maintenance RED Gate

on:
  push:
    branches:
      - feature/final-04-service-logistics
    paths:
      - game/tests/SimulationServiceLogisticsTests.cpp
      - .github/workflows/final04-one-shot-simulation-authority.yml

permissions:
  contents: read

jobs:
  preventive-maintenance-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build integration test
        run: cmake --build build --config Release --target hh_SimulationServiceLogistics_tests --parallel 4
      - name: Run integration test
        run: build/game/hh_SimulationServiceLogistics_tests
