name: FINAL-04 One-Shot Simulation Integration

on:
  push:
    branches:
      - feature/final-04-service-logistics
    paths:
      - tools/final04_patch_simulation.py

permissions:
  contents: write

jobs:
  apply-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
          fetch-depth: 0
      - name: Apply anchored Simulation integration patch
        run: python tools/final04_patch_simulation.py
      - name: Commit integration
        run: |
          git config user.name "hotel-haven-final04-bot"
          git config user.email "actions@users.noreply.github.com"
          git add game/src/Simulation.cpp
          git diff --cached --exit-code && exit 1 || true
          git commit -m "feat(game): wire FINAL-04 through Simulation"
          git push origin HEAD:feature/final-04-service-logistics
