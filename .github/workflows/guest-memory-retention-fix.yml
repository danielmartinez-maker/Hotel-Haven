name: Guest Memory Retention Fix

on:
  push:
    branches:
      - stress/final02-construction-guest
    paths:
      - .github/workflows/guest-memory-retention-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stress/final02-construction-guest
          fetch-depth: 0

      - name: Prune fully decayed guest memories
        shell: python
        run: |
          from pathlib import Path

          path = Path("game/src/GuestPsychology.cpp")
          text = path.read_text(encoding="utf-8")
          old = "  if (magnitude > 0 && event.memorySalience > 0) {\n    GuestMemory memory;\n"
          new = "  if (magnitude > 0 && event.memorySalience > 0) {\n    constexpr double kMemoryRetentionContributionFloor = 0.01;\n    state.memories.erase(\n        std::remove_if(state.memories.begin(), state.memories.end(),\n                       [&](const GuestMemory &existing) {\n                         return existing.halfLifeHours > 0 &&\n                                std::abs(memoryContribution(\n                                    existing, event.timestampSeconds)) <\n                                    kMemoryRetentionContributionFloor;\n                       }),\n        state.memories.end());\n\n    GuestMemory memory;\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("guest memory insertion anchor not found")
          path.write_text(text, encoding="utf-8")

      - name: Build guest regression targets
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target hh_guest_psychology_tests hh_guest_psychology_stress_tests hh_final02_continuation_stress_tests --parallel 4

      - name: Reproduce memory-pressure failure
        shell: bash
        env:
          HH_STRESS_SCALE: pr
          HH_STRESS_SEED: "0xc0ffee1234abcdef"
          HH_STRESS_SCENARIO: memory_pressure
        run: ./build/game/hh_guest_psychology_stress_tests

      - name: Run focused FINAL-02 regression tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure -R 'hh_guest_psychology_tests|StressGuestPsychology|StressFinal02Continuation'

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "hotel-haven-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/src/GuestPsychology.cpp
          if git diff --cached --quiet; then
            echo "Fix already present"
            exit 0
          fi
          git commit -m "fix: retire fully decayed guest memories"
          git push origin HEAD:stress/final02-construction-guest
