name: Apply Full-Game NVIDIA Bridge

on:
  push:
    branches:
      - feature/full-game-nvidia-integration
    paths:
      - '.github/workflows/apply-full-game-nvidia-bridge.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-game-nvidia-integration
          fetch-depth: 0
      - name: Apply deterministic integration patch
        run: python Tools/Integration/run_existing_bridge.py
      - name: Check patch formatting
        run: git diff --check
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build portable targets
        run: cmake --build build --config Release --parallel 4
      - name: Test portable integration
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Commit tested integration
        shell: bash
        run: |
          rm -f Tools/Integration/run_existing_bridge.py
          rm -f Tools/Integration/apply_full_game_nvidia_bridge.py
          rm -f Tools/Integration/apply_scheduler_patch.py
          rm -f .github/workflows/apply-full-game-nvidia-bridge.yml
          rm -f .github/workflows/apply-full-game-nvidia-patch.yml
          rmdir Tools/Integration 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate deterministic staff optimizer seam"
          git push origin HEAD:feature/full-game-nvidia-integration
