name: FINAL-04 Service Logistics CI

on:
  pull_request:
    paths:
      - 'game/include/hh/game/ServiceTypes.h'
      - 'game/include/hh/game/Housekeeping.h'
      - 'game/include/hh/game/Laundry.h'
      - 'game/include/hh/game/Logistics.h'
      - 'game/include/hh/game/Engineering.h'
      - 'game/include/hh/game/RoomService.h'
      - 'game/include/hh/game/ServiceLogistics.h'
      - 'game/src/Housekeeping.cpp'
      - 'game/src/Laundry.cpp'
      - 'game/src/Logistics.cpp'
      - 'game/src/Engineering.cpp'
      - 'game/src/RoomService.cpp'
      - 'game/src/ServiceLogistics.cpp'
      - 'game/src/Simulation.cpp'
      - 'game/tests/HousekeepingTests.cpp'
      - 'game/tests/LaundryTests.cpp'
      - 'game/tests/LogisticsTests.cpp'
      - 'game/tests/EngineeringTests.cpp'
      - 'game/tests/ServiceLogisticsTests.cpp'
      - 'game/tests/ServiceLogisticsSoakTests.cpp'
      - 'game/tests/SimulationServiceLogisticsTests.cpp'
      - '.github/workflows/final04-service-logistics-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-simulation-authority:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-04-service-logistics
          fetch-depth: 0
      - name: Apply anchored Simulation authority patch
        run: python tools/final04_patch_simulation_authority.py
      - name: Commit Simulation bridge if changed
        run: |
          git config user.name "hotel-haven-final04-bot"
          git config user.email "actions@users.noreply.github.com"
          git add game/src/Simulation.cpp
          if git diff --cached --quiet; then
            echo "Simulation authority patch already applied"
            exit 0
          fi
          git commit -m "feat(game): make FINAL-04 authoritative in Simulation"
          git push origin HEAD:feature/final-04-service-logistics

  portable-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile FINAL-04 portable systems
        run: |
          mkdir -p build/final04
          CXXFLAGS='-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Igame/include'
          for src in Logistics Housekeeping Laundry Engineering RoomService ServiceLogistics; do
            g++ $CXXFLAGS -c game/src/${src}.cpp -o build/final04/${src}.o
          done
      - name: Run FINAL-04 behavior and soak tests
        run: |
          CXXFLAGS='-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Igame/include'
          OBJECTS='build/final04/Logistics.o build/final04/Housekeeping.o build/final04/Laundry.o build/final04/Engineering.o build/final04/RoomService.o build/final04/ServiceLogistics.o'
          for test in Housekeeping Laundry Logistics Engineering ServiceLogistics ServiceLogisticsSoak; do
            g++ $CXXFLAGS game/tests/${test}Tests.cpp $OBJECTS -o build/final04/${test}Tests
            build/final04/${test}Tests
          done
