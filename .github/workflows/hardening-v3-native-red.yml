name: Hardening V3 Native RED

on:
  push:
    branches:
      - hardening/asset-quality-v3

jobs:
  native-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure native content pipeline
        run: cmake -S Tools/ContentPipeline -B Tools/ContentPipeline/build -A x64

      - name: Build native content pipeline
        run: cmake --build Tools/ContentPipeline/build --config Release

      - name: Run native content-pipeline tests
        run: ctest --test-dir Tools/ContentPipeline/build -C Release --output-on-failure
