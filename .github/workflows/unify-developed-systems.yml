name: Unify Developed Systems
on:
  push:
    branches:
      - 'integration/**'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure integration identity
        run: |
          git config user.name "Hotel Haven Integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Merge developed system branches
        shell: bash
        run: |
          set -euo pipefail
          BASE_INTEGRATION="$(git rev-parse origin/integration/unify-developed-systems-2026-09-24)"
          merge_branch() {
            local branch="$1"
            echo "::group::Merging $branch"
            if ! git merge --no-ff --no-edit -X ours "origin/$branch"; then
              echo "::error::Automatic merge failed for $branch"
              echo "Unresolved paths:"
              git diff --name-only --diff-filter=U || true
              git status --short
              exit 1
            fi
            echo "::endgroup::"
          }

          merge_branch main
          merge_branch feature/final-01-construction-building-systems
          merge_branch feature/elevator-actor-routing-final02
          merge_branch feature/asset-pipeline-v2-800-assets
          merge_branch hardening/asset-quality-v3
          merge_branch feature/full-game-integration
          merge_branch feature/full-game-nvidia-integration
          merge_branch feature/nvidia-optimization-openusd
          merge_branch hardening/extensive-optimization-2026-09-10

          # The latest FINAL-07/FINAL-04 simulation core is authoritative.
          # Older completed systems are integrated around it rather than
          # text-merging incompatible historical generations of this monolith.
          git restore --source=origin/fix/final07-authoritative-service-ops-ui -- \
            game/src/Simulation.cpp \
            game/include/hh/game/Simulation.h \
            game/src/Housekeeping.cpp \
            game/include/hh/game/Housekeeping.h \
            game/src/Engineering.cpp \
            game/include/hh/game/Engineering.h \
            game/src/ServiceLogistics.cpp \
            game/include/hh/game/ServiceLogistics.h \
            game/include/hh/game/ServiceTypes.h

          # Graft the verified FINAL-03 workforce/organization simulation hooks
          # onto the newer authoritative simulation core using FINAL-03's own
          # base blobs for a true three-way application.
          git show 61cf91be477c3a79a17dce38ea080d5cc5972f81 -- \
            game/include/hh/game/Simulation.h \
            game/src/Simulation.cpp > /tmp/final03-simulation.patch
          if ! git apply --3way --index /tmp/final03-simulation.patch; then
            echo "::error::FINAL-03 simulation graft produced conflicts"
            git status --short
            git diff --cc -- game/include/hh/game/Simulation.h game/src/Simulation.cpp || true
            exit 1
          fi

          # Squash the integration result onto the integration base. This keeps the
          # developed source/content changes while avoiding GitHub App workflow-file
          # write restrictions from historical branch workflow commits.
          git reset --soft "$BASE_INTEGRATION"
          git restore --source="$BASE_INTEGRATION" --staged --worktree .github/workflows
          git add -A
          git commit -m "integration: unify developed Hotel Haven systems"

      - name: Verify expected developed systems are present
        shell: bash
        run: |
          set -euo pipefail
          test -f game/include/hh/game/Construction.h
          test -f game/include/hh/game/GuestPsychology.h
          test -f game/include/hh/game/Workforce.h
          test -f game/include/hh/game/ServiceLogistics.h
          test -f frontend/include/hh/frontend/GameUiRuntime.h
          test -f game/audio/SoundtrackPlayer.h
          test -f GameData/AssetDefinitions/hotel_haven_asset_manifest_v2.json
          test -f Tools/OpenUsdPipeline/hh_usd.py
          test -f Tools/BalanceLab/balance_lab.py

      - name: Checkpoint merged integration tree
        shell: bash
        run: git push --force-with-lease origin HEAD:integration/unified-checkpoint-2026-09-24

      - name: Configure unified build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build unified tree
        run: cmake --build build --config Release --parallel 4

      - name: Test unified tree
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate Python tooling
        run: |
          python3 -m unittest Tools.BalanceLab.test_balance_lab
          python3 -m unittest Tools.OpenUsdPipeline.test_hh_usd

      - name: Commit and push unified tree
        shell: bash
        run: |
          set -euo pipefail
          echo "Validated checkpoint remains at integration/unified-checkpoint-2026-09-24."
